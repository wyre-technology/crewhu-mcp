services:
  mcp:
    build:
      context: .
    ports:
      - "8080:8080"
    environment:
      - MCP_TRANSPORT=http
      - MCP_HTTP_PORT=8080
      - MCP_HTTP_HOST=0.0.0.0
      - AUTH_MODE=${AUTH_MODE:-env}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      # Required when AUTH_MODE=env
      - CREWHU_API_TOKEN=${CREWHU_API_TOKEN}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
